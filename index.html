<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Volos Ferienhaus</title>

  <!-- RESPONSIVE: Stellt sicher, dass es auf dem Handy gut aussieht -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Verknüpfung zum Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- MANIFEST: sagt dem Browser, dass dies eine PWA ist -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS: Aktiviert Vollbild-Modus und Icon auf Apple-Geräten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- iOS-Icon (wird nicht immer perfekt umgesetzt, aber ist ein Versuch wert) -->
  <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>

  <h1>Willkommen in eurem Zuhause auf Zeit!</h1>
  <p>Liebe Freunde, herzlich willkommen in unserem Ferienhaus in Volos! ...</p>

  <!-- DU KANNST HIER DEINE GANZE BROSCHÜRE REINSCHREIBEN -->
  <h2>Notfallnummern</h2>
  <ul>
    <li>Polizei: 100</li>
    <li>Feuerwehr: 199</li>
    <li>Notarzt: 166</li>
  </ul>
  <!-- usw. -->

  <!-- Service Worker registrieren -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker registriert!'))
        .catch(err => console.log('SW Registrierung fehlgeschlagen', err));
    }
  </script>

</body>
</html>
